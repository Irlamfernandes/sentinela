[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinela"
version = "0.1.0"
description = "Auditoria de segurança do PC (Linux). Só leitura: aponta problemas e como resolver."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sentinela = "sentinela.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sentinela"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "SIM", "RUF", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.per-file-ignores]
# Testes podem usar asserts e caminhos fixos; não precisam das regras de segurança.
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
